[project]
name = "agent-harness"
version = "0.1.0"
description = "Sketch of an agent harness: interfaces and call order only."
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["fastmcp>=2.4", "litellm", "pydantic>=2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
