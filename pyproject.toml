[project]
name = "agent-harness"
version = "0.1.0"
description = "Lean async Harness core with bounded context, durable runs, and artifact-aware adapters."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = ["litellm"]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.8",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = ["architecture: validates dependency-direction contracts"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
