[project]
name = "agent-harness"
version = "0.1.0"
description = "Async-first agent harness with isolated sessions, durable tasks, sandboxed tools, and observability."
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["fastmcp>=2.4", "litellm", "pydantic>=2", "pyyaml>=6"]

[dependency-groups]
dev = ["mypy>=1.15", "pytest>=8", "ruff>=0.8"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = ["architecture: validates dependency-direction contracts"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
