name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install
        run: uv sync --locked

      - name: Check format
        run: uv run --locked ruff format --check .

      - name: Check lint
        run: uv run --locked ruff check .

      - name: Check types
        run: uv run --locked mypy src

      - name: Run tests
        timeout-minutes: 15
        run: >-
          uv run --locked python -m pytest
          --ignore=tests/unit/adapters/artifacts/test_filesystem_artifacts.py
          --ignore=tests/unit/adapters/persistence/test_sqlite_journal.py

      - name: Run filesystem Artifact tests
        timeout-minutes: 10
        run: >-
          uv run --locked python -m pytest -vv
          tests/unit/adapters/artifacts/test_filesystem_artifacts.py

      - name: Run SQLite journal tests
        timeout-minutes: 10
        run: >-
          uv run --locked python -m pytest -vv
          tests/unit/adapters/persistence/test_sqlite_journal.py
