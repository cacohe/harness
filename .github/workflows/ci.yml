name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install
        run: uv sync --locked

      - name: Check format
        run: uv run --locked ruff format --check .

      - name: Check lint
        run: uv run --locked ruff check .

      - name: Check types
        run: uv run --locked mypy src

      - name: Diagnose filesystem artifact tests
        timeout-minutes: 10
        run: uv run --locked python -m pytest -vv tests/unit/adapters/artifacts/test_filesystem_artifacts.py

      - name: Run tests
        run: uv run --locked python -m pytest
